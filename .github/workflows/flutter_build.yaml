name: Flutter CI/CD

on:
  pull_request:
    branches:
      - stage

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0' # Use your version
          cache: true  # Enables pub cache automatically

      # 3. Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Get Dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Run Tests (Optional)
      # - name: Run tests
      #   run: flutter test

      # 6. Build APK for Staging
      - name: Build Staging APK
        run: flutter build apk --flavor stage -t lib/main_stage.dart

      # 7. Upload Artifact (APK)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: staging-apk
          path: build/app/outputs/flutter-apk/app-stage-release.apk
